<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivicCare Admin Dashboard</title>
<style>
:root{--bg:#f5f7f4;--surface:#fff;--text:#17231c;--muted:#66736b;--primary:#176b45;--primary-dark:#0f5234;--soft:#e7f3ec;--border:#dfe6e1;--danger:#b42318;--warning:#9a6700;--shadow:0 12px 35px rgba(23,35,28,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.nav{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 5%;position:sticky;top:0;z-index:10}.brand{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:850}.icon{width:38px;height:38px;border-radius:12px;background:var(--primary);color:white;display:grid;place-items:center}.nav span{font-size:13px;color:var(--muted)}
.container{max-width:1250px;margin:auto;padding:34px 20px 60px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.head h1{margin:0;font-size:clamp(30px,4vw,46px);letter-spacing:-.04em}.head p{color:var(--muted);margin:8px 0 0}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.refresh{background:var(--primary);color:white}.refresh:hover{background:var(--primary-dark)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:21px;box-shadow:var(--shadow)}.stat-label{font-size:13px;color:var(--muted);font-weight:700}.stat-number{font-size:34px;font-weight:850;margin-top:7px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:white;border:1px solid var(--border);padding:14px;border-radius:16px;margin-bottom:18px}.toolbar input,.toolbar select{padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fbfcfb;outline:none}.toolbar input{min-width:240px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.complaint{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.photo{width:100%;height:220px;object-fit:cover;background:#edf2ee}.body{padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.category{font-size:12px;font-weight:850;letter-spacing:.06em;color:var(--primary)}.title{font-size:18px;font-weight:800;margin:6px 0}.desc{color:var(--muted);line-height:1.5;margin:8px 0 15px}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:850}.PENDING{background:#fff4d6;color:var(--warning)}.RESOLVED{background:#dff5e8;color:#12613c}.REOPENED{background:#ffe7d6;color:#9a3b00}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--border);padding-top:14px}.meta b{color:var(--text)}.id{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;margin-top:12px;color:#59665e}.actions{margin-top:17px;display:flex;gap:9px}.resolve{background:var(--primary);color:#fff;flex:1}.pending-btn{background:#fff4d6;color:var(--warning);flex:1}.disabled{opacity:.5;cursor:not-allowed}.empty{background:#fff;border:1px dashed var(--border);border-radius:18px;padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}.notice{display:none;padding:13px 15px;border-radius:12px;margin-bottom:18px}.notice.error{background:#fff0ef;color:var(--danger);display:block}.loading{text-align:center;color:var(--muted);padding:30px;grid-column:1/-1}
@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.head{align-items:start;flex-direction:column}}
@media(max-width:520px){.container{padding:22px 13px}.stats{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.toolbar input{min-width:100%;width:100%}.head .refresh{width:100%}.photo{height:190px}}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand"><span class="icon">✓</span> CivicCare Admin</div>
  <span>Complaint management dashboard</span>
</nav>

<main class="container">
  <div class="head">
    <div><h1>Complaint dashboard</h1><p>Review reports and update their status.</p></div>
    <button class="btn refresh" id="refreshBtn">↻ Refresh complaints</button>
  </div>

  <div id="notice" class="notice"></div>

  <section class="stats">
    <div class="stat"><div class="stat-label">TOTAL COMPLAINTS</div><div class="stat-number" id="total">—</div></div>
    <div class="stat"><div class="stat-label">PENDING</div><div class="stat-number" id="pending">—</div></div>
    <div class="stat"><div class="stat-label">RESOLVED</div><div class="stat-number" id="resolved">—</div></div>
    <div class="stat"><div class="stat-label">REOPENED</div><div class="stat-number" id="reopened">—</div></div>
  </section>

  <div class="toolbar">
    <input id="search" placeholder="Search by complaint ID or description">
    <select id="filter"><option value="ALL">All statuses</option><option value="PENDING">Pending</option><option value="REOPENED">Reopened</option><option value="RESOLVED">Resolved</option></select>
    <select id="categoryFilter"><option value="ALL">All categories</option><option>GARBAGE</option><option>TRAFFIC</option><option>STREETLIGHT</option><option>POTHOLE</option><option>OTHER</option></select>
  </div>

  <section id="complaints" class="grid"></section>
</main>

<script>
const API_BASE="https://hll4g6l8fd.execute-api.ap-south-1.amazonaws.com";
let complaints=[];

const esc=v=>String(v ?? "—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

async function loadComplaints(){
  const box=document.getElementById("complaints");
  box.innerHTML='<div class="loading">Loading complaints...</div>';
  try{
    const res=await fetch(API_BASE+"/admin/complaints");
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||"Could not load complaints.");
    complaints=data.complaints||[];
    updateStats();
    render();
    document.getElementById("notice").style.display="none";
  }catch(e){
    box.innerHTML="";
    const n=document.getElementById("notice");n.textContent=e.message;n.className="notice error";n.style.display="block";
  }
}

function updateStats(){
  document.getElementById("total").textContent=complaints.length;
  document.getElementById("pending").textContent=complaints.filter(c=>c.status==="PENDING").length;
  document.getElementById("resolved").textContent=complaints.filter(c=>c.status==="RESOLVED").length;
  document.getElementById("reopened").textContent=complaints.filter(c=>c.status==="REOPENED").length;
}

function render(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const status=document.getElementById("filter").value;
  const category=document.getElementById("categoryFilter").value;
  const list=complaints.filter(c=>{
    const text=(c.complaintId+" "+c.description).toLowerCase();
    return (!q||text.includes(q)) && (status==="ALL"||c.status===status) && (category==="ALL"||c.category===category);
  });
  const box=document.getElementById("complaints");
  if(!list.length){box.innerHTML='<div class="empty">No complaints match the current filters.</div>';return;}
  box.innerHTML=list.map(c=>`
    <article class="complaint">
      ${c.imageUrl?`<img class="photo" src="${c.imageUrl}" alt="Complaint photo" onerror="this.style.display='none'">`:`<div class="photo"></div>`}
      <div class="body">
        <div class="top">
          <div><div class="category">${esc(c.category||"OTHER")}</div><div class="title">${esc(c.description||"Civic complaint")}</div></div>
          <span class="badge ${esc(c.status||"PENDING")}">${esc(c.status||"PENDING")}</span>
        </div>
        <div class="meta">
          <div>📅 <b>${esc(c.date||"—")}</b></div>
          <div>🕒 <b>${esc(c.time||"—")}</b></div>
          <div>📍 <b>${esc(c.locationName||"—")}</b></div>
          <div>Latitude: <b>${esc(c.latitude||"—")}</b></div>
          <div>Longitude: <b>${esc(c.longitude||"—")}</b></div>
        </div>
        <div class="id">ID: ${esc(c.complaintId)}</div>
        ${c.audioUrl ? `<div style="margin-top:13px"><div style="font-size:12px;font-weight:800;margin-bottom:6px">Complaint voice</div><audio style="width:100%" controls src="${c.audioUrl}"></audio></div>` : ""}
        <div class="actions">
          ${c.status==="RESOLVED"
            ? '<button class="btn pending-btn" disabled>✓ Resolved</button>'
            : `<button class="btn resolve" onclick="updateStatus('${esc(c.complaintId)}','RESOLVED')">${c.status==="REOPENED" ? "Review & mark resolved" : "Mark as resolved"}</button>`}
        </div>
      </div>
    </article>`).join("");
}

async function updateStatus(id,status){
  if(!confirm("Mark this complaint as RESOLVED?")) return;
  try{
    const res=await fetch(API_BASE+"/admin/complaints",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({complaintId:id,status})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||"Could not update status.");
    const item=complaints.find(c=>c.complaintId===id);
    if(item) item.status=status;
    updateStats();render();
  }catch(e){alert(e.message);}
}
document.getElementById("refreshBtn").onclick=loadComplaints;
document.getElementById("search").oninput=render;
document.getElementById("filter").onchange=render;
document.getElementById("categoryFilter").onchange=render;
loadComplaints();
</script>
</body>
</html>
